<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPyS - Register</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        html, body {
            height: 100%;
        }

        html {
            display: table;
            margin: auto;
        }

        body {
            display: table-cell;
            vertical-align: middle;
        }
        
        button {
            cursor: pointer;
            text-align: center;
            display: table-cell;
            vertical-align :middle;
            font-size: medium;
            font-weight: bold;
            width: 100%;
            height: 35px;
            margin: auto;
            cursor: pointer;
        }
        
        #error {
            display: none;
            color: red;
        }

        .container {
            padding: 75px;
            border: 2px solid lightgray;
            box-shadow: 0px 5px 5px 0px rgba(33, 33, .1);
            border-radius: 10%;
        }

        #prompt {
            font-weight: bold;
            font-size: 32px;
            margin: 16px;
            text-align: center;
        }

        .input {
            display: flex;
            padding: auto;
            width: 300px;
            height: 25px;
            justify-content: center;
            font-size: 16px;
            margin: auto;
        }
    </style>
    <link rel="icon" href="{{url_for('static', filename='favicon.ico')}}">
</head>
<body>
    <div class="container">
        <p id="prompt">Register</p>
        <p>Username:</p>
        <input id="name" class="input">
        <p>Password:</p>
        <input id="password" class="input" type="password"><br>
        <button id="button">Submit</button>
        <p id="error">An error has occurred. Try clearing your cookies and trying again.</p>
    </div>
    <script>
        let button = document.getElementById("button")
        let name_input = document.getElementById("name")
        let pass_input = document.getElementById("password")
        let error = document.getElementById("error")

        button.addEventListener("click", async () => {
            let response = await fetch("{{url_for('register')}}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({"name": name_input.value, "password": pass_input.value})
            })

            if (!response.ok) {
                error.style.display = "block"
                error.textContent = await response.text()
            } else {
                window.location.replace("{{url_for('game')}}");
            }

        })
    </script>
</body>
</html>
