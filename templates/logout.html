<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPyS - Logout</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        html, body {
            height: 100%;
        }

        html {
            display: table;
            margin: auto;
        }

        body {
            display: table-cell;
            vertical-align: middle;
        }
        
        #button {
            cursor: pointer;
            text-align: center;
            display: table-cell;
            vertical-align :middle;
            font-size: medium;
            font-weight: bold;
            width: 100%;
            height: 35px;
            margin: auto;
        }
        
        #error {
            display: none;
        }

        .center {
            text-align: center;
        }


        .container {
            padding: 75px;
            border: 2px solid lightgray;
            box-shadow: 0px 5px 5px 0px rgba(33, 33, .1);
            border-radius: 10%;
        }

        #prompt {
            font-weight: bold;
            font-size: 32px;
            margin: 16px;
            text-align: center;
        }

        .input {
            display: flex;
            padding: auto;
            width: 300px;
            height: 25px;
            justify-content: center;
            font-size: 16px;
            margin: auto;
        }
    </style>
    <link rel="icon" href="{{url_for('static', filename='favicon.ico')}}">
</head>
<body>
    <div class="container">
        <p id="prompt">Success</p>
        <p class="center">You have been logged out.</p>
    </div>
</body>
</html>
