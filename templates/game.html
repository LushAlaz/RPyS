<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      /* god i hate css */
      * {
        font-family: Helvetica;
      }
      
      ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: rgb(255, 255, 94);
        margin-bottom: 50px;
      }

      li {
        display: inline-block;
        vertical-align: top;
        height: 120px;
      }

      img {
        width: 120px;
      }

      li a {
        display: table-cell;
        color: black;
        vertical-align: middle;
        padding-left: 10px;
        padding-right: 10px;
        height: 120px;
        font-weight: bold;
        font-size: x-large;
      }

      li a:hover {
        background-color: rgb(181, 181, 0);
      }

      button.rock {
        background: #F9F9F9;
        width: 200px;
        height: 200px;
        transition: box-shadow .3s;
        border: 5px solid #AA6C39;
        background: yellow;
        border-radius: 30%;
        margin: auto;
        cursor: pointer;
        font-size: 75px;
        justify-content: center;
        margin-top: auto;
        margin-bottom: auto;
        margin-right: auto;
        margin-left: auto;
        display: grid;
        text-align: auto;
        align-items: center;
      }

      button.rock:hover {
        box-shadow: 0 0 15px rgba(33, 33, 33, .4);
        justify-content: center;
      }

      .rock:active {
        scale: .96;
      }

      button.paper {
        background: #F9F9F9;
        width: 200px;
        height: 200px;
        transition: box-shadow .5s;
        border: 5px solid #AA6C39;
        background: yellow;
        border-radius: 30%;
        cursor: pointer;
        font-size: 75px;
        justify-content: center;
        margin-top: 4.8%;
        margin-bottom: auto;
        margin-right: auto;
        margin-left: 30%;
        display: grid;
        text-align: auto;
        align-items: center;
        position: absolute;
      }

      button.paper:hover {
        box-shadow: 0 0 15px rgba(33, 33, 33, .4);
        justify-content: center;
      }

      .paper:active {
        scale: .96;
      }

      button.scissors {
        background: #F9F9F9;
        width: 200px;
        height: 200px;
        transition: box-shadow .5s;
        border: 5px solid #AA6C39;
        background: yellow;
        border-radius: 30%;
        cursor: pointer;
        font-size: 75px;
        justify-content: center;
        margin-top: 5%;
        margin-bottom: auto;
        margin-right: 30%;
        margin-left: auto;
        display: grid;
        text-align: auto;
        align-items: center;
      }

      button.scissors:hover {
        box-shadow: 0 0 15px rgba(33, 33, 33, .4);
        justify-content: center;
      }

      .scissors:active {
        scale: .96;
      }

      body {
        display: grid;
        padding: 10px;
      }

      #flash {
        margin: auto;
        padding: 30px;
        display: flex;
        justify-content: center;
        font-weight: bold;
      }
    </style>
    <link rel="icon" type="image/x-icon" href="{{url_for('static', filename='favicon.ico')}}">
    <title>RPyS - Game</title>
  </head>
  <body>
      <ul class="nav">
        <li><img src="{{url_for('static', filename='rps.png')}}"></img></li>
        <li><a style="text-decoration: none" href="./game">Game</a></li>
        <li><a style="text-decoration: none" href="./wins">Leaderboard</a></li>
        <li><a style="text-decoration: none" href="./logout">Log Out</a></li>
      </ul>
    <div>
      <button class="rock" id="rock">🪨</button>
      <button class="paper" id="paper">📄</button>
      <button class="scissors" id="scissors">✂️</button>
    </div>
    <h2 id="flash"></h2>
    <script>
      function convertOptionToString(option) {
        switch (option) {
          case 0:
            return "rock"
            break;
          case 1:
            return "paper"
            break;
          case 2:
            return "scissors"
            break;
          default:
            return "Unknown"
            break;
        }
      }
      function pickRandomAndCompare(playerOption, computerOption) {
        // theres prolly a better way to do this
        // but i dont care enough for now
        switch (playerOption) {
          case 0:
            switch (computerOption) {
              case 0:
                return -1
              case 1:
                return 0
              case 2:
                return 1
              default:
                return null
            }
            break;
          case 1:
            switch (computerOption) {
              case 0:
                return 1
              case 1:
                return -1
              case 2:
                return 0
              default:
                return null
            }
            break;
          case 2:
            switch (computerOption) {
              case 0:
                return 0
              case 1:
                return 1
              case 2:
                return -1
              default:
                return null
            }
          break;
          default:
            return -Infinity
            break;
        }
      }
      async function sendWin() {
        let response = await fetch("{{url_for('win')}}", {
              method: "POST",
          })

          if (!response.ok) {
            statusFlash.style.color = "red"
            statusFlash.innerText = await response.text()
            return
          }

          let winCount = await response.text()
          statusFlash.style.color = "black"
          statusFlash.innerText = `The computer picked ${computerOption}, you win!\nYou now have ${winCount} wins.`
      }
      function onButtonClick(playerOption) {
        computerOption = Math.floor(Math.random() * 3)
        result = pickRandomAndCompare(playerOption, computerOption)
        console.log(arguments)
        computerOption = convertOptionToString(computerOption)
        if (result == 1) {
          sendWin()
        }
        else if (result == 0) {
          statusFlash.style.color = "black"
          statusFlash.innerText = `The computer picked ${computerOption}, you lose!`
        }
        else {
          statusFlash.style.color = "black"
          statusFlash.innerText = `The computer picked ${computerOption}, game tied!`
        }
      }

      const rockButton = document.getElementById("rock")
      const paperButton = document.getElementById("paper")
      const scissorsButton = document.getElementById("scissors")
        
      const statusFlash = document.getElementById("flash")

      rockButton.addEventListener("click", () => onButtonClick(0))
      paperButton.addEventListener("click", () => onButtonClick(1))
      scissorsButton.addEventListener("click", () => onButtonClick(2))
    </script>
  </body>
</html>
