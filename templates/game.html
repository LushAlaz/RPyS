<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      /* god i hate css */
      * {
        font-family: Helvetica;
      }
      
      ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: rgb(255, 255, 94);
        margin-bottom: 50px;
      }

      li {
        display: inline-block;
        vertical-align: top;
        height: 120px;
      }

      img {
        width: 120px;
      }

      li a {
        display: table-cell;
        color: black;
        vertical-align: middle;
        padding-left: 10px;
        padding-right: 10px;
        height: 120px;
        font-weight: bold;
        font-size: x-large;
      }

      li a:hover {
        background-color: rgb(181, 181, 0);
      }

      button.rock {
        background: #F9F9F9;
        width: 200px;
        height: 200px;
        transition: box-shadow .3s;
        border: 5px solid #AA6C39;
        background: yellow;
        border-radius: 30%;
        margin: auto;
        cursor: pointer;
        font-size: 75px;
        justify-content: center;
        margin-top: auto;
        margin-bottom: auto;
        margin-right: auto;
        margin-left: auto;
        display: grid;
        text-align: auto;
        align-items: center;
      }

      button.rock:hover {
        box-shadow: 0 0 15px rgba(33, 33, 33, .4);
        justify-content: center;
      }

      .rock:active {
        scale: .96;
      }

      button.paper {
        background: #F9F9F9;
        width: 200px;
        height: 200px;
        transition: box-shadow .5s;
        border: 5px solid #AA6C39;
        background: yellow;
        border-radius: 30%;
        cursor: pointer;
        font-size: 75px;
        justify-content: center;
        margin-top: 4.8%;
        margin-bottom: auto;
        margin-right: auto;
        margin-left: 30%;
        display: grid;
        text-align: auto;
        align-items: center;
        position: absolute;
      }

      button.paper:hover {
        box-shadow: 0 0 15px rgba(33, 33, 33, .4);
        justify-content: center;
      }

      .paper:active {
        scale: .96;
      }

      button.scissors {
        background: #F9F9F9;
        width: 200px;
        height: 200px;
        transition: box-shadow .5s;
        border: 5px solid #AA6C39;
        background: yellow;
        border-radius: 30%;
        cursor: pointer;
        font-size: 75px;
        justify-content: center;
        margin-top: 5%;
        margin-bottom: auto;
        margin-right: 30%;
        margin-left: auto;
        display: grid;
        text-align: auto;
        align-items: center;
      }

      button.scissors:hover {
        box-shadow: 0 0 15px rgba(33, 33, 33, .4);
        justify-content: center;
      }

      .scissors:active {
        scale: .96;
      }

      body {
        display: grid;
        padding: 10px;
      }

      #flash {
        margin: auto;
        padding: 30px;
        display: flex;
        justify-content: center;
        font-weight: bold;
      }
    </style>
    <link rel="icon" type="image/x-icon" href="{{url_for('static', filename='favicon.ico')}}">
    <script defer src="{{url_for('static', filename='js/game.js')}}"></script>
    <title>RPyS - Game</title>
  </head>
  <body>
      <ul class="nav">
        <li><img src="{{url_for('static', filename='rps.png')}}"></img></li>
        <li><a style="text-decoration: none" href="./game">Game</a></li>
        <li><a style="text-decoration: none" href="./wins">Leaderboard</a></li>
        <li><a style="text-decoration: none" href="./logout">Log Out</a></li>
      </ul>
    <div>
      <button class="rock" id="rock">🪨</button>
      <button class="paper" id="paper">📄</button>
      <button class="scissors" id="scissors">✂️</button>
    </div>
    <h2 id="flash"></h2>
  </body>
</html>
